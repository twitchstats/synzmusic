  /* ===== visual upgrade ===== */

const DEFAULT_TIERS = [['S','#ef6b57'],['A','#ee9a55'],['B','#ecc95a'],['C','#a8d36a'],['D','#62a9e6'],['F','#a37be6']];

let uid = 0;
const nid = p => p + Date.now().toString(36) + (uid++);

function freshState() {
  const releases = [];
  const seenTracks = new Set();
  RELEASES.forEach(([id, name, year, cover, kind, tracks], releaseOrder) => {
    const sourceOrder = releaseOrder * 100;
    tracks.forEach(([trackId, trackName], trackOrder) => {
      const key = trackName.normalize('NFC').toLocaleLowerCase('ru').replace(/\s+/g, ' ').trim();
      if (seenTracks.has(key)) return;
      seenTracks.add(key);
      releases.push({
        id: 'track_' + trackId, name: trackName, year, sourceOrder: sourceOrder + trackOrder + 0.1,
        kind: 'Трек', tier: 'pool', poster: cover || ''
      });
    });
  });
  return {
    tiers: DEFAULT_TIERS.map(([name, color], i) => ({ id: 't' + i, name, color })),
    releases
  };
}
const LEGACY = { 'track_krasota_piano2': 'track_krasota_piano' }; // обложка обновлена: сохраняем тир, берём новую картинку
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!state || !state.tiers || !state.releases) {
  state = freshState();
} else {
  const catalog = freshState();
  const previous = new Map(state.releases.map(f => [f.id, f]));
  const catalogIds = new Set(catalog.releases.map(f => f.id));
  const merged = catalog.releases.map(f => {
    const moved = !previous.get(f.id) && LEGACY[f.id] ? previous.get(LEGACY[f.id]) : null;
    if (moved) return { ...f, name: moved.name || f.name, tier: moved.tier || 'pool' };
    const old = previous.get(f.id);
    return old ? { ...f, name: old.name || f.name, poster: old.poster || f.poster, tier: old.tier || 'pool' } : f;
  }).concat(state.releases.filter(f => String(f.id).startsWith('u') && !catalogIds.has(f.id)));
  const seenNames = new Set();
  catalog.releases = merged.filter(f => {
    const key = String(f.name || '').normalize('NFC').toLocaleLowerCase('ru').replace(/\s+/g, ' ').trim();
    if (seenNames.has(key)) return false;
    seenNames.add(key);
    return true;
  });
  state = { tiers: state.tiers, releases: catalog.releases };
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
let savedTimer;

  el.textContent = ok ? 'сохранено ✓ в этом браузере' : 'не удалось сохранить: браузер блокирует хранилище';

const posterOf = f => f.poster || '';

function textColor(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#14141b' : '#ffffff';
}

const pool = document.getElementById('pool');

  );

}

function applyCardFilters() {
  const query = document.getElementById('cardSearch').value.trim().toLocaleLowerCase('ru');
  const cards = [...document.querySelectorAll('.card')];
  let shown = 0;
  cards.forEach(card => {
    const matches = !query || card.dataset.search.includes(query);
    card.classList.toggle('filtered-out', !matches);
    if (matches) shown++;
  });
  document.getElementById('filterCount').textContent = query
    ? 'Показано ' + shown + ' из ' + cards.length
    : 'Всего ' + cards.length + ' треков';
  document.getElementById('clearFilters').disabled = !query;
}

function makeCard(f) {
  const card = document.createElement('div'); card.className = 'card'; card.draggable = true; card.dataset.id = f.id;
  card.dataset.search = String(f.name || '').toLocaleLowerCase('ru');
  card.innerHTML = '<div class="poster"></div><div class="name-s"></div><div class="year-s"></div>';
  const p = card.querySelector('.poster'); p.textContent = f.name;
  const src = posterOf(f);
  if (src) { const img = new Image(); img.onload = () => { p.style.backgroundImage = 'url("' + src.replace(/"/g, '%22') + '")'; p.classList.add('has'); }; img.src = src; }
  card.querySelector('.name-s').textContent = f.name;
  card.querySelector('.year-s').textContent = f.year ? 'Трек · ' + f.year : 'Трек';
  card.title = f.name;
  const e = document.createElement('button'); e.className = 'edit'; e.textContent = '✎'; e.title = 'Изменить';
  e.addEventListener('click', ev => { ev.stopPropagation(); openDialog(f.id); });
  card.appendChild(e);
  p.addEventListener('click', () => openViewer(f.id));
  card.addEventListener('dragstart', ev => { dragId = f.id; card.classList.add('dragging'); ev.dataTransfer.setData('text/plain', f.id); ev.dataTransfer.effectAllowed = 'move'; });
  card.addEventListener('dragend', () => { dragId = null; card.classList.remove('dragging'); document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
  return card;
}

function moveRelease(id, tier, beforeId) {
  if (id === beforeId) return;
  const i = state.releases.findIndex(f => f.id === id); if (i < 0) return;
  const [f] = state.releases.splice(i, 1);
  f.tier = tier;
  let j = beforeId ? state.releases.findIndex(x => x.id === beforeId) : -1;
  if (j < 0) {
    let last = -1; state.releases.forEach((x, k) => { if (x.tier === tier) last = k; });
    j = last < 0 ? state.releases.length : last + 1;
  }
  state.releases.splice(j, 0, f);
  save(); render();
}
function moveTier(idx, d) {
  const j = idx + d; if (j < 0 || j >= state.tiers.length) return;
  const [t] = state.tiers.splice(idx, 1); state.tiers.splice(j, 0, t); save(); render();
}

async function downloadTierlistImage() {
  const button = document.getElementById('downloadImage');
  button.disabled = true;
  const oldText = button.textContent;
  button.textContent = 'Готовлю изображение…';
  try {
    const width = 1600, scale = 2, margin = 42, labelWidth = 116;
    const cardWidth = 150, coverSize = 132, cardGap = 16, cardStep = 200;
    const contentX = margin + labelWidth + 18;
    const contentWidth = width - contentX - margin - 10;
    const perRow = Math.max(1, Math.floor((contentWidth + cardGap) / (cardWidth + cardGap)));
    const poolItems = state.releases.filter(f => f.tier === 'pool').sort((a, b) =>
      (Number(b.year) || 0) - (Number(a.year) || 0) || (a.sourceOrder ?? Number.MAX_SAFE_INTEGER) - (b.sourceOrder ?? Number.MAX_SAFE_INTEGER)
    );
    const groups = state.tiers.map(t => ({
      name: t.name, color: t.color, items: state.releases.filter(f => f.tier === t.id)
    }));
    groups.push({ name: 'ПУЛ', color: '#202024', items: poolItems });
    const rowHeights = groups.map(g => Math.max(176, Math.ceil(g.items.length / perRow) * cardStep + 24));
    const height = 174 + rowHeights.reduce((sum, n) => sum + n, 0) + 34;
    const canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, width, height);

    const imageEntries = await Promise.all(state.releases.map(async f => {
      const src = posterOf(f);
      if (!src.startsWith('data:image/') && !/^https?:\/\//i.test(src)) return [f.id, null];
      return [f.id, await new Promise(resolve => {
        const img = new Image();
        if (/^https?:\/\//i.test(src)) img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      })];
    }));
    const images = new Map(imageEntries);

    ctx.fillStyle = '#7d7a72';
    ctx.font = '12px "JetBrains Mono", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SYNZ  /  DISCOGRAPHY TIERLIST', margin, 36);
    ctx.fillStyle = '#f3efe4';
    ctx.font = '54px Anton, Impact, sans-serif';
    ctx.fillText('SYNZ', margin, 98);
    ctx.fillStyle = '#b7b2a7';
    ctx.font = '18px Inter, Arial, sans-serif';
    ctx.fillText('Тирлист · Треки', margin, 132);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f3efe4';
    ctx.font = '16px "JetBrains Mono", monospace';
    ctx.fillText(state.releases.length + ' карточек', width - margin, 82);
    ctx.fillStyle = '#7d7a72';
    ctx.font = '12px "JetBrains Mono", monospace';
    ctx.fillText(new Date().toLocaleDateString('ru-RU'), width - margin, 106);

    function wrapText(text, centerX, y, maxWidth, lineHeight, maxLines) {
      const words = String(text || '').split(/\s+/);
      const lines = [];
      let line = '';
      for (const word of words) {
        const next = line ? line + ' ' + word : word;
        if (line && ctx.measureText(next).width > maxWidth) {
          lines.push(line);
          line = word;
        } else line = next;
      }
      if (line) lines.push(line);
      if (lines.length > maxLines) {
        lines.length = maxLines;
        lines[maxLines - 1] = lines[maxLines - 1].slice(0, Math.max(1, lines[maxLines - 1].length - 1)) + '…';
      }
      lines.forEach((lineText, i) => ctx.fillText(lineText, centerX, y + i * lineHeight, maxWidth));
    }

    let y = 158;
    groups.forEach((group, groupIndex) => {
      const rowHeight = rowHeights[groupIndex];
      ctx.fillStyle = group.color;
      ctx.fillRect(margin, y, labelWidth, rowHeight);
      ctx.fillStyle = group.name === 'ПУЛ' ? '#f3efe4' : textColor(group.color);
      ctx.font = '30px Anton, Impact, sans-serif';
      ctx.textAlign = 'center';
      wrapText(group.name, margin + labelWidth / 2, y + rowHeight / 2, labelWidth - 16, 34, 3);
      ctx.fillStyle = '#0d0d0e';
      ctx.fillRect(contentX, y, width - contentX - margin, rowHeight);
      ctx.strokeStyle = '#1f1f22';
      ctx.strokeRect(margin, y, width - margin * 2, rowHeight);
      group.items.forEach((f, i) => {
        const col = i % perRow, row = Math.floor(i / perRow);
        const x = contentX + 12 + col * (cardWidth + cardGap);
        const cardY = y + 12 + row * cardStep;
        const img = images.get(f.id);
        ctx.fillStyle = '#161616';
        ctx.fillRect(x, cardY, coverSize, coverSize);
        if (img) ctx.drawImage(img, x, cardY, coverSize, coverSize);
        else {
          ctx.fillStyle = '#b7b2a7';
          ctx.font = '12px Inter, Arial, sans-serif';
          ctx.textAlign = 'center';
          wrapText(f.name, x + coverSize / 2, cardY + 54, coverSize - 14, 17, 4);
        }
        ctx.strokeStyle = '#303034';
        ctx.strokeRect(x, cardY, coverSize, coverSize);
        ctx.fillStyle = '#e9e6dc';
        ctx.font = '600 12px Inter, Arial, sans-serif';
        ctx.textAlign = 'center';
        wrapText(f.name, x + coverSize / 2, cardY + coverSize + 19, coverSize, 15, 2);
        ctx.fillStyle = '#7d7a72';
        ctx.font = '10px "JetBrains Mono", monospace';
        ctx.fillText(f.year ? String(f.year) : '—', x + coverSize / 2, cardY + coverSize + 51, coverSize);
      });
      y += rowHeight;
    });

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('Не удалось сформировать PNG');
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'SYNZ-discography-tierlist.png';
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  } catch (err) {
    console.error('Image export failed', err);
    alert('Не удалось скачать изображение в этом браузере.');
  } finally {
    button.disabled = false;
    button.textContent = oldText;
  }
}

const viewer = document.getElementById('viewer'), vImg = document.getElementById('vImg'), vCap = document.getElementById('vCap');
let viewId = null;
function viewList() {
  return [...document.querySelectorAll('.card')].filter(c => !c.classList.contains('filtered-out'))
    .map(c => state.releases.find(f => f.id === c.dataset.id)).filter(f => f && posterOf(f));
}
function openViewer(id) {
  const f = state.releases.find(x => x.id === id); if (!f || !posterOf(f)) return;
  viewId = id; vImg.src = posterOf(f); vImg.alt = f.name;
  vCap.innerHTML = ''; vCap.append(f.name);
  const sm = document.createElement('small'); sm.textContent = f.year ? 'Трек · ' + f.year : 'Трек'; vCap.appendChild(sm);
  viewer.classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeViewer() { viewer.classList.remove('open'); document.body.style.overflow = ''; vImg.removeAttribute('src'); viewId = null; }
function stepViewer(d) {
  const list = viewList(); if (list.length < 2) return;
  const i = list.findIndex(f => f.id === viewId);
  openViewer(list[(i + d + list.length) % list.length].id);
}
async function downloadCover() {
  const f = state.releases.find(x => x.id === viewId); if (!f) return;
  const src = posterOf(f);
  const safe = String(f.name).replace(/[\\/:*?"<>|]+/g, '').trim() || 'cover';
  const save = (href, ext) => { const a = document.createElement('a'); a.href = href; a.download = safe + '.' + ext; document.body.appendChild(a); a.click(); a.remove(); };
  try {
    if (src.startsWith('data:')) { save(src, (src.match(/^data:image\/(\w+)/) || [,'jpg'])[1].replace('jpeg', 'jpg')); return; }
    const r = await fetch(src, { mode: 'cors' }); if (!r.ok) throw new Error('http ' + r.status);
    const blob = await r.blob(); const url = URL.createObjectURL(blob);
    save(url, (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg')); setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { window.open(src, '_blank', 'noopener'); }
}
document.getElementById('vClose').addEventListener('click', closeViewer);
document.getElementById('vDl').addEventListener('click', downloadCover);
document.getElementById('vPrev').addEventListener('click', () => stepViewer(-1));
document.getElementById('vNext').addEventListener('click', () => stepViewer(1));
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
document.addEventListener('keydown', e => {
  if (!viewer.classList.contains('open')) return;
  if (e.key === 'Escape') closeViewer(); else if (e.key === 'ArrowLeft') stepViewer(-1); else if (e.key === 'ArrowRight') stepViewer(1);
});

    let size=clamp(Math.round(ui.labelW*0.4),18,56);
    el.style.fontSize=size+'px';
    while(size>12 && (el.scrollWidth>el.clientWidth+1 || el.scrollHeight>maxH)){ size-=1; el.style.fontSize=size+'px'; }
    if(el.scrollWidth>el.clientWidth+1){ el.style.wordBreak='break-word'; el.style.overflowWrap='anywhere'; }
  }
  function fitAll(){ document.querySelectorAll('.row').forEach(r=>{ const n=r.querySelector('.label .name'); if(n) fitName(n,r); }); }
  function drag(el,onMove,onEnd){
    el.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      el.setPointerCapture(e.pointerId); el.classList.add('active'); document.body.classList.add('resizing');
      const sx=e.clientX, sy=e.clientY;
      const mv=ev=>onMove(ev.clientX-sx,ev.clientY-sy);
      const up=()=>{ el.classList.remove('active'); document.body.classList.remove('resizing');
        el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up); onEnd&&onEnd(); };
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
      onMove.start&&onMove.start();
    });
  }
  function enhance(){
    applyVars();
    document.querySelectorAll('.board .row').forEach((row,i)=>{
      const t=state.tiers[i]; if(!t) return;
      if(ui.rowH[t.id]) row.style.minHeight=ui.rowH[t.id]+'px';
      const g=document.createElement('div'); g.className='grip'; g.title='Потяни, чтобы изменить высоту строки (двойной клик — сброс)';
      let h0=0; const mv=(dx,dy)=>{ const h=clamp(h0+dy,90,1400); row.style.minHeight=h+'px'; ui.rowH[t.id]=Math.round(h); const n=row.querySelector('.label .name'); if(n) fitName(n,row); };
      mv.start=()=>{ h0=row.offsetHeight; };
      drag(g,mv,saveUI);
      g.addEventListener('dblclick',()=>{ delete ui.rowH[t.id]; row.style.minHeight=''; saveUI(); fitAll(); });
      row.appendChild(g);
      const label=row.querySelector('.label');
      const lg=document.createElement('div'); lg.className='lgrip'; lg.title='Потяни, чтобы изменить ширину названий тиров';
      let w0=0; const mw=(dx)=>{ ui.labelW=Math.round(clamp(w0+dx,56,360)); applyVars(); fitAll(); };
      mw.start=()=>{ w0=ui.labelW; };
      drag(lg,mw,saveUI); label.appendChild(lg);
      const name=label.querySelector('.name');
      if(name){ name.addEventListener('input',()=>fitName(name,row)); name.addEventListener('blur',()=>fitName(name,row)); }
    });
    requestAnimationFrame(fitAll);
  }
  const _render=render;
  render=function(){ _render.apply(this,arguments); enhance(); };
  document.getElementById('cardSize').addEventListener('input',e=>{ ui.card=+e.target.value; applyVars(); });
  document.getElementById('cardSize').addEventListener('change',saveUI);
  document.getElementById('resetSizes').addEventListener('click',()=>{ ui={card:132,labelW:116,rowH:{}}; saveUI(); document.querySelectorAll('.row').forEach(r=>r.style.minHeight=''); applyVars(); fitAll(); });
  window.addEventListener('resize',fitAll);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll);
  applyVars(); enhance();
})();

/* local-backup-v1 */
(function(){
  const UKEY='synz-ui-v1';
  const $=id=>document.getElementById(id);
  const st=$('fileStatus');
  const msg=(t,ok)=>{ st.textContent=t; st.classList.toggle('ok',!!ok); };
  function payload(){
    let ui={}; try{ ui=JSON.parse(localStorage.getItem(UKEY))||{}; }catch(e){}
    return JSON.stringify({app:'synz-tierlist',v:1,saved:new Date().toISOString(),key:KEY,state:state,ui:ui});
  }
  function applyPayload(txt){
    const d=JSON.parse(txt);
    if(!d||!d.state||!d.state.tiers||!d.state.releases) throw new Error('bad');
    localStorage.setItem(KEY,JSON.stringify(d.state));
    if(d.ui) localStorage.setItem(UKEY,JSON.stringify(d.ui));
    location.reload();
  }
  // --- ручной экспорт / импорт
  $('fileExport').addEventListener('click',()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([payload()],{type:'application/json'}));
    a.download='synz-tierlist-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    msg('файл скачан ✓',true);
  });
  $('fileImport').addEventListener('click',()=>$('fileImportInput').click());
  $('fileImportInput').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    if(!confirm('Загрузить данные из файла? Текущие тиры и размеры будут заменены.')){ e.target.value=''; return; }
    f.text().then(applyPayload).catch(()=>{ alert('Не удалось прочитать файл: нужен JSON, сохранённый этой страницей.'); e.target.value=''; });
  });
  // --- автозапись в выбранный файл (Chrome/Edge)
  const canFS=!!(window.showSaveFilePicker&&window.indexedDB);
  const idb=(mode,fn)=>new Promise((res,rej)=>{
    const rq=indexedDB.open('synz-fs',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('h');
    rq.onerror=()=>rej(rq.error);
    rq.onsuccess=()=>{ const tx=rq.result.transaction('h',mode); const r=fn(tx.objectStore('h')); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); };
  });
  let handle=null, timer=null, busy=false, dirty=false;
  async function write(){
    if(!handle) return;
    if(busy){ dirty=true; return; }
    busy=true;
    try{
      const w=await handle.createWritable(); await w.write(payload()); await w.close();
      msg('в файл записано ✓ '+new Date().toLocaleTimeString('ru-RU'),true);
    }catch(e){ msg('не удалось записать файл — нажми «Автосохранение в файл»',false); handle=null; $('fileLink').hidden=false; }
    busy=false; if(dirty){ dirty=false; write(); }
  }
  function schedule(){ if(!handle) return; clearTimeout(timer); timer=setTimeout(write,700); }
  const _save=save;
  save=function(){ _save.apply(this,arguments); schedule(); };
  document.addEventListener('synz-ui-saved',schedule);
  window.addEventListener('pagehide',()=>{ if(handle) write(); });
  async function link(){
    try{
      handle=await showSaveFilePicker({suggestedName:'synz-tierlist.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      await idb('readwrite',s=>s.put(handle,'file'));
      $('fileLink').textContent='🔗 Файл подключён'; await write();
    }catch(e){ if(e&&e.name!=='AbortError') msg('браузер не дал доступ к файлу',false); }
  }
  if(canFS){
    $('fileLink').hidden=false; $('fileLink').addEventListener('click',link);
    idb('readonly',s=>s.get('file')).then(async h=>{
      if(!h) return;
      const perm=await h.queryPermission({mode:'readwrite'});
      if(perm==='granted'){ handle=h; $('fileLink').textContent='🔗 Файл подключён'; write(); }
      else { $('fileLink').textContent='🔗 Продолжить автосохранение в файл';
        $('fileLink').onclick=async()=>{ if(await h.requestPermission({mode:'readwrite'})==='granted'){ handle=h; $('fileLink').textContent='🔗 Файл подключён'; write(); } else link(); };
        $('fileLink').removeEventListener('click',link); }
    }).catch(()=>{});
  } else { msg('автозапись в файл не поддерживается этим браузером — используй «В файл»',false); }
  // страховка: пишем всё в localStorage при любых закрытиях
  window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} });
})();
</script>
